<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Client Login — ORVANA FinEd</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--navy:#144269;--teal:#259792;--ink:#1a2733;--slate:#5a6b7a;--line:#e6ecf1;--paper:#f7f9fb;--radius:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--paper);min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 32px;height:68px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center}
.logo img{height:48px;width:auto}
.topbar-link{font-size:.9rem;color:var(--slate);font-weight:500}
.topbar-link:hover{color:var(--teal)}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:44px 40px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(20,66,105,.08)}
.card-head{text-align:center;margin-bottom:32px}
.card-head h1{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:600;color:var(--navy);margin-bottom:8px}
.card-head p{color:var(--slate);font-size:.95rem}
.field{margin-bottom:20px}
.field label{display:block;font-size:.87rem;font-weight:600;color:var(--ink);margin-bottom:7px}
.field input{width:100%;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;font-family:'Outfit';font-size:.97rem;color:var(--ink);outline:none;transition:border .2s,box-shadow .2s}
.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(37,151,146,.1)}
.btn-full{width:100%;padding:14px;background:var(--navy);color:#fff;border:none;border-radius:12px;font-family:'Outfit';font-size:1rem;font-weight:600;cursor:pointer;transition:all .22s;margin-top:6px}
.btn-full:hover{background:var(--teal);transform:translateY(-1px);box-shadow:0 8px 22px rgba(37,151,146,.28)}
.btn-full:disabled{opacity:.6;cursor:not-allowed;transform:none}
.divider{text-align:center;color:var(--slate);font-size:.87rem;margin:22px 0;position:relative}
.divider::before{content:"";position:absolute;left:0;top:50%;width:42%;height:1px;background:var(--line)}
.divider::after{content:"";position:absolute;right:0;top:50%;width:42%;height:1px;background:var(--line)}
.link-row{text-align:center;font-size:.9rem;color:var(--slate);margin-top:20px}
.link-row a{color:var(--teal);font-weight:600}
.link-row a:hover{text-decoration:underline}
.msg{padding:12px 16px;border-radius:10px;font-size:.9rem;margin-bottom:18px;display:none}
.msg.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;display:block}
.msg.success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;display:block}
footer{text-align:center;padding:20px;font-size:.8rem;color:#9fb2c4}
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="logo"><img src="Orvana.png" alt="ORVANA FinEd"/></a>
  <a href="index.html" class="topbar-link">← Back to website</a>
</div>
<div class="main">
  <div class="card">
    <div class="card-head">
      <h1>Client Login</h1>
      <p>Access your investment portfolio and documents</p>
    </div>
    <div id="msg" class="msg"></div>
    <div class="field">
      <label>Email address</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
    </div>
    <button class="btn-full" id="loginBtn" onclick="handleLogin()">Sign in</button>
    <div class="divider">or</div>
    <div class="link-row">Don't have an account? <a href="register.html">Register here</a></div>
  </div>
</div>
<footer>&copy; 2026 ORVANA FinEd. Mutual fund investments are subject to market risks.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://vwznmkcytvpnkuycntnu.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3em5ta2N5dHZwbmt1eWNudG51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMTU3OTEsImV4cCI6MjA5NTY5MTc5MX0.oIWG5jPWFL5FqD9xSTKiVSIlrUqa7wAtiNDR3U21Xz4';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

function showMsg(text,type){const m=document.getElementById('msg');m.textContent=text;m.className='msg '+type;}

async function handleLogin(){
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('password').value;
  const btn=document.getElementById('loginBtn');
  if(!email||!pass){showMsg('Please fill in all fields.','error');return;}
  btn.disabled=true;btn.textContent='Signing in...';
  const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){showMsg(error.message,'error');btn.disabled=false;btn.textContent='Sign in';return;}
  // check if admin
  if(email==='admin@orvanafined.com'){window.location.href='admin.html';return;}
  window.location.href='dashboard.html';
}

document.addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin();});
// if already logged in, redirect
sb.auth.getSession().then(({data})=>{if(data.session){window.location.href='dashboard.html';}});
</script>
</body>
</html>
